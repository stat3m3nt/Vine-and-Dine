<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- style sheet -->
    <link href="style.css" rel="stylesheet">
    
   

     
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google fonts -->
     <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <title>Vine and Dine</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">

                <!-- Brand Logo -->
                <a class="navbar-brand position-relative d-inline-block" href="#">
                     <img src="./images/logo-img.png" alt="Vine & Dine Logo" height="100" class="logo-img">
                     <span class="logo-text position-absolute top-50 start-50 translate-middle">Vine <span class="logo-symbol">&</span> Dine</span>
                </a>   

                <!-- Hamburger Button for mobile -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Nav items -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">

                        <!-- Map/Explore -->
                        <li class="nav-item mx-3">
                            <a class="nav-link" href="#">Explore</a>
                        </li>

                        <!-- Add winery -->
                        <li class="nav-item me-3">
                            <a class="nav-link" href="#winery-form-container">Add Winery</a>
                        </li>

                        <!-- Log In Button -->
                        <li class="nav-item">
                            <a class="btn btn-outline-dark rounded-pill px-3 login-btn" href="#">Log In</a>
                        </li>
              
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="map"></div>

        <!-- Add winery form -->
         <div class="container mt-4 mb-4">
            <div id="winery-form-container" class="card p-4">
                <h5 class="card-title text-center"> Add Winery </h5>
                <form id="winery-form">
                    <div class="mb-3">
                        <label for="winery-name">Winery Name</label>
                        <input type="text" class="form-control" id="winery-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="winery-address" text-center>Address</label>
                        <input type="text" class="form-control" id="winery-address" required>
                    </div>
                    <button id="submit-btn" type="submit" class="btn custom-btn">Add</button>
                </form>
            </div>
         </div>
    </main>

    

    <!-- JS script -->
     <script src="script.js"></script>
    <!-- Google Maps API -->
    <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBazMWRtcmtkfKR0iZMU1fvc1ajvnoXhc4
&libraries=maps,marker,routes&callback=initMap"></script>

   

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
